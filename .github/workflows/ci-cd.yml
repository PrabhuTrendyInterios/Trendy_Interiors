name: Trendy Interiors CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'trendyinteriors/client/**'
      - 'trendyinteriors/server/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'trendyinteriors/client/**'
      - 'trendyinteriors/server/**'
      - '.github/workflows/ci-cd.yml'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Frontend CI  (React / react-scripts)
  # Terminal output will show every test file as:
  #   PASS  src/test/components/Header.test.jsx
  #   PASS  src/test/pages/Home.test.jsx  ...
  # Followed by the summary block:
  #   Test Suites: 38 passed, 38 total
  #   Tests:       74 passed, 74 total
  #   Snapshots:    0 total
  #   Time:         8.229 s
  #   Ran all test suites.
  #   Test results written to: test-results\jest-results.json
  # ─────────────────────────────────────────────────────────────────────────────
  client-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trendyinteriors/client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: ./trendyinteriors/client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # --verbose  → prints one PASS / FAIL line per test file (the coloured list)
      # --json     → also writes machine-readable results to the outputFile
      # Both flags work together with react-scripts test
      - name: Run Frontend Tests
        env:
          CI: true
          FORCE_COLOR: '1'       # keeps green PASS / red FAIL colours in the log
        run: |
          mkdir -p test-results
          npm test -- \
            --verbose \
            --json \
            --outputFile=test-results/jest-results.json

      # Upload JSON report so it appears as a downloadable artifact on the run page
      - name: Upload Frontend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: ./trendyinteriors/client/test-results/jest-results.json
          retention-days: 7

      - name: Build Frontend Application
        run: npm run build

      - name: Upload Build Artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./trendyinteriors/client/build/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Backend CI  (Express / Jest directly)
  # Same output format: verbose PASS lines + summary + JSON written to file
  # ─────────────────────────────────────────────────────────────────────────────
  server-ci:
    name: Backend CI (Express & Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trendyinteriors/server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: ./trendyinteriors/server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-12345
          JWT_EXPIRE: 30d
          FORCE_COLOR: '1'
        run: |
          mkdir -p test-results
          npm test -- \
            --verbose \
            --json \
            --outputFile=test-results/jest-results.json

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: ./trendyinteriors/server/test-results/jest-results.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 — Deploy  (runs only after both CI jobs pass on main / master)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Application
    needs: [client-ci, server-ci]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-build

      - name: Deploy Frontend (Netlify / Vercel / S3)
        run: |
          echo "Deploying client build to hosting provider..."
          # Netlify example:
          # npx netlify-cli deploy \
          #   --dir=./frontend-build --prod \
          #   --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
          #   --site=${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy Backend (Render / Heroku / AWS)
        run: |
          echo "Deploying backend server..."
          # Render deploy-hook example:
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
